services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # 全部从项目根目录的 .env 注入；缺失时 compose 直接报错，不再回退到仓库内的默认口令
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}
      TZ: Asia/Shanghai
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 $$ 让变量在容器内展开，避免依赖宿主机环境变量
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  agent_pgdata:
