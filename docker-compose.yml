services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # 全部从项目根目录的 .env 注入；缺失时 compose 直接报错，不再回退到仓库内的默认口令
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}
      TZ: Asia/Shanghai
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 $$ 让变量在容器内展开，避免依赖宿主机环境变量
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:?请在 .env 中设置 ADMIN_INVITE_CODE}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?请在 .env 中设置 SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}
      TZ: Asia/Shanghai
    volumes:
      - agent_chroma:/app/智能体/rag/chroma_db

volumes:
  agent_pgdata:
  agent_chroma:
