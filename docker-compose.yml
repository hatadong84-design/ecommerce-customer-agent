services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # 本地开发用默认值即可；公开部署时通过环境变量覆盖，不要把真实口令写死进仓库
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent123456}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      TZ: Asia/Shanghai
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  agent_pgdata:
