{% extends "base.html" %}
{% block content %}
<section class="auth-layout">
  <div class="auth-aside">
    <span class="auth-mark" aria-hidden="true">管</span>
    <p class="eyebrow">ADMIN WORKSPACE</p>
    <h2>让每一条售后请求<br>都有清晰的处理记录</h2>
    <p>登录后可查看会话、处理人工工单、维护知识库并生成使用报告。</p>
    <div class="auth-feature"><span>01</span><span>工单状态与处理历史可追溯</span></div>
    <div class="auth-feature"><span>02</span><span>知识文档索引状态集中管理</span></div>
  </div>
  <div class="auth-card">
    <p class="eyebrow">欢迎回来</p>
    <h2>管理员登录</h2>
    <p class="auth-intro">使用管理员账号进入售后运营工作区。</p>
    <form class="auth-form" method="post" action="/login">
      <label for="login-username">用户名</label>
      <input id="login-username" name="username" autocomplete="username" placeholder="请输入用户名" required>
      <label for="login-password">密码</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      <button class="button button-primary button-full" type="submit">登录工作区 <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">还没有管理员账号？ <a href="/register">使用邀请码注册</a></p>
  </div>
</section>
{% endblock %}
